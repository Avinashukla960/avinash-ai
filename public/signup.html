<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — avinash.ai</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="auth-brand">
      <div class="logo-mark">A</div>
      <span class="brand-text">avinash.ai</span>
    </div>

    <h1>Create your account</h1>
    <p class="subtitle">
      Tell us a bit about yourself so your assistant can personalize
      its advice from the very first message.
    </p>

    <form id="signup-form">
      <div class="section-title">Account</div>

      <label>
        Email
        <input type="email" name="email" required autocomplete="email" />
      </label>

      <label>
        Password
        <input type="password" name="password" required minlength="6" autocomplete="new-password" />
      </label>

      <div class="section-title">Your profile</div>

      <label>
        Name
        <input type="text" name="name" required placeholder="What should we call you?" />
      </label>

      <label>
        Age
        <input type="number" name="age" min="1" max="120" />
      </label>

      <label>
        Goals
        <textarea name="goals" rows="2" placeholder="e.g. lose 10 lbs, run a 5k, sleep better"></textarea>
      </label>

      <label>
        Health notes / conditions
        <textarea name="healthNotes" rows="2" placeholder="e.g. mild asthma, lower back pain, allergies"></textarea>
      </label>

      <label>
        Activity level
        <select name="activityLevel">
          <option value="">— Select —</option>
          <option value="sedentary">Sedentary (little or no exercise)</option>
          <option value="light">Lightly active (1–3 days/week)</option>
          <option value="moderate">Moderately active (3–5 days/week)</option>
          <option value="very_active">Very active (6–7 days/week)</option>
          <option value="athlete">Athlete (training daily or physical job)</option>
        </select>
      </label>

      <label>
        Diet preferences
        <textarea name="dietPreferences" rows="2" placeholder="e.g. vegetarian, gluten-free, no shellfish"></textarea>
      </label>

      <label>
        Anything else we should know?
        <textarea name="anythingElse" rows="3" placeholder="Job, stress level, pets, hobbies, schedule…"></textarea>
      </label>

      <button type="submit" class="primary">Create account</button>
      <p id="error" class="error"></p>
    </form>

    <p class="footer-link">Already have an account? <a href="/login.html">Log in</a></p>
  </main>

  <script>
    const form  = document.getElementById('signup-form');
    const errEl = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());
      const profile = {
        name:             data.name,
        age:              data.age ? Number(data.age) : null,
        goals:            data.goals,
        healthNotes:      data.healthNotes,
        activityLevel:    data.activityLevel,
        dietPreferences:  data.dietPreferences,
        anythingElse:     data.anythingElse
      };
      errEl.textContent = '';
      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: data.email, password: data.password, profile })
        });
        const json = await res.json();
        if (!res.ok) {
          errEl.textContent = json.error || 'Signup failed.';
          return;
        }
        window.location.href = '/chat.html';
      } catch (err) {
        errEl.textContent = 'Network error. Please try again.';
      }
    });
  </script>
</body>
</html>
